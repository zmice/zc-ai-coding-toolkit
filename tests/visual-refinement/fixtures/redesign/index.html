<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>工单管理 · 本地演示</title><link rel="stylesheet" href="tokens.css"><style>main{background:white;padding:20px}table{width:100%;border-collapse:collapse}td,th{padding:16px;border:1px solid #ddd}dialog{max-width:600px}label{margin-right:12px}</style></head><body><main><h1>工单管理</h1><p>本地演示 · 不连接后端</p><label>搜索<input id="search" type="search"></label><label>状态<select id="status"><option>全部</option><option>待处理</option><option>处理中</option></select></label><button id="clear">清空筛选</button><p id="count" aria-live="polite"></p><div id="list"></div></main><dialog id="detail" aria-labelledby="detail-title"><h2 id="detail-title"></h2><p id="description"></p><p id="meta"></p><form id="assign"><label>处理人<select id="owner"><option value="">请选择</option><option>陈明</option><option>李青</option></select></label><label><input type="checkbox" id="fail">模拟失败</label><button id="submit">分派</button><p id="feedback" role="status"></p></form><button id="close">关闭详情</button></dialog><script type="module" src="app.js"></script></body></html>
